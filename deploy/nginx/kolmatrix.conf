# ============================================================================
# deploysvr 宿主 nginx vhost — kol.guangai.ai（BL-PROD-MIGRATE-DEPLOYSVR F-MIG-01）
# ============================================================================
# 直连模型：用户 → Cloudflare DNS → deploysvr 公网 80/443（本 vhost + Certbot TLS）→
#   127.0.0.1:3001（kolmatrix app 容器）。与既有 aigc/grandtianfu/invoce 块监听不冲突。
#
# 依赖 deploysvr 已有的 conf.d/00-http-upgrade-map.conf（$proxy_connection_upgrade，aigc 迁移时装）。
#
# 安装（见 runbook F-MIG-04 P4）：
#   cp deploy/nginx/kolmatrix.conf /etc/nginx/sites-available/kolmatrix.conf
#   ln -sf /etc/nginx/sites-available/kolmatrix.conf /etc/nginx/sites-enabled/kolmatrix.conf
#   mkdir -p /var/www/certbot
#   # Certbot DNS-01 预签发（DNS 未切也能签，零 TLS 空窗）；两域各签一张证书，路径与下方 vhost 对应。
#   # kolquest.com 是独立 Cloudflare zone —— token 需覆盖 guangai.ai + kolquest.com 两 zone。
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare.ini -d kol.guangai.ai
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare.ini -d kolquest.com
#   nginx -t && systemctl reload nginx
# ----------------------------------------------------------------------------

upstream kolmatrix_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# --- HTTP: ACME challenge + 跳转 HTTPS（kol + kolquest 共用）---
server {
    listen 80;
    listen [::]:80;
    server_name kol.guangai.ai kolquest.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- kol.guangai.ai — KOLMatrix 主应用（Next.js）---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kol.guangai.ai;

    ssl_certificate     /etc/letsencrypt/live/kol.guangai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kol.guangai.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 10m; # 上传（如租户 logo）留余量

    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_vary on;

    # Next 构建产物：内容哈希文件名，强缓存
    location /_next/static/ {
        proxy_pass http://kolmatrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API 路由：关闭缓冲（AI/流式响应不被截断），不缓存
    location /api/ {
        proxy_pass http://kolmatrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # 应用主体（SSR 页面 + 其余），带 websocket upgrade 头（无害）
    location / {
        proxy_pass http://kolmatrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $proxy_connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# --- kolquest.com — 品牌域 301 → 主站（旧机 BI3-F006 行为，随迁）---
# 注：kolquest.com 的邮件发件基础设施（DKIM/SPF/MX/DMARC 在 Cloudflare DNS）与本机无关，不动。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kolquest.com;

    ssl_certificate     /etc/letsencrypt/live/kolquest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolquest.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://kol.guangai.ai$request_uri;
}
