name: Deploy to Staging

# ⚠️ DEPRECATED — BL-PROD-MIGRATE-DEPLOYSVR 决策 A：staging 弃用，随旧 VM 退役而消失。
# 本 workflow 面向旧机 staging.kol.guangai.ai（PM2 模型），迁移后不再维护。
# 保留仅为审计/回滚参考；请勿在新 deploysvr 上运行。新部署走 deploy-prod.yml（容器化）。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to deploy"
        default: "main"
        required: true
        type: string
      run_seed:
        description: "Run npm run db:seed after deploy (re-loads demo data)"
        default: true
        type: boolean

concurrency:
  # Never let two staging deploys overlap
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.ref }} to staging.kol.guangai.ai
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      # Reuse the `production` environment to access PROD_HOST / PROD_USER /
      # PROD_SSH_KEY secrets — staging lives on the same VPS as prod (see
      # .auto-memory/environment.md §"生产服务器（与 aigcgateway 共机）"),
      # so the SSH credentials are identical. We deploy to a different
      # path (/opt/kolmatrix-staging) and a different PM2 app name.
      name: production
      url: https://staging.kol.guangai.ai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: SSH + run deploy-staging.sh on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: RUN_SEED
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd /opt/kolmatrix-staging
            # BL-024-F006 (BL-034-F001 retroactive): export .env.staging
            # vars into the shell so deploy-staging.sh + the post-deploy
            # ALTER ROLE step (added in F006) can read KOLMATRIX_APP_PASSWORD,
            # HEALTH_DETAIL_TOKEN, etc. Mirror of the deploy-prod.yml fix.
            set -a
            source .env.staging
            set +a
            bash infrastructure/deploy-staging.sh
            if [[ "$RUN_SEED" == "true" ]]; then
              echo "── post-deploy: npm run db:seed"
              # BL-034-F002 added a NODE_ENV=production guard inside
              # prisma/seed.ts — it hard-throws to keep someone from
              # accidentally re-seeding prod with the well-known demo
              # password. Staging's .env.staging legitimately sets
              # NODE_ENV=production (Next.js needs it for the prod
              # build), so we override the var ONLY for the seed
              # invocation. The seed script's own error message
              # documents this escape verbatim.
              NODE_ENV=development npm run db:seed
              echo "✅ seed complete"
            else
              echo "── seed skipped per workflow input"
            fi
        env:
          RUN_SEED: ${{ inputs.run_seed }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deploy of ${{ inputs.ref }} failed."
          echo "See SSH script log above; common causes:"
          echo "  - prisma migrate deploy failed (schema drift)"
          echo "  - next build OOM (raise --max-old-space-size in script)"
          echo "  - pm2 restart hung (check pm2 logs kolmatrix-staging)"
          echo "  - health check git_sha mismatch (build cache stale)"
