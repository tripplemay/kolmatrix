name: Build & Push images

# BL-PROD-MIGRATE-DEPLOYSVR F-MIG-02 — CI 构建 Docker 镜像推 GHCR，deploysvr 只 pull（H5 红线：
# 不在 7.8GB 无 swap 的机上 build）。每次 main push 按 github.sha 打不可变 tag + latest。
# 构建 Dockerfile 的两个 target：runner(app 运行时) + migrate(全量依赖, 迁移/cron tsx)。
on:
  push:
    branches: [main]
    # 与 ci.yml 一致：状态/文档类改动不触发镜像构建
    paths-ignore:
      - ".auto-memory/**"
      - "progress.json"
      - "features.json"
      - "backlog.json"
      - "docs/**"
      - "design-draft/**"
      - "framework/**"
      - "**/*.md"
      - "harness-rules.md"
      - ".claude/**"
      - "harness.json"
      - "harness.lock"
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false # 每个 sha 的镜像都要产出，不取消在途构建

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/tripplemay/kolmatrix

jobs:
  build-push:
    name: Build + push app & migrate images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # app 运行时镜像（Next standalone）。GIT_SHA 烘进镜像供 /api/health 报告版本。
      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_BASE }}/app:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # migrate 镜像（全量 node_modules + prisma CLI + tsx + 源码）。共享 base 层，缓存复用。
      - name: Build & push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/migrate:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
