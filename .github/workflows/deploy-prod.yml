name: Deploy to Production (deploysvr)

# BL-PROD-MIGRATE-DEPLOYSVR F-MIG-02 — 容器化部署（旧 PM2/git-pull 模型已废弃）。
# SSH deploysvr → docker compose pull → 一次性 migrate → up -d app → 健康检查。
# 镜像由 build-push.yml 预构建推 GHCR；本 workflow 只 pull 不 build。
#
# ⚠️ 割接时（F-MIG-04 P4）需更新 GitHub repo secrets（名称不变，值改新机）：
#     PROD_HOST   = 194.238.26.173   （旧值 34.180.93.185，回滚时改回）
#     PROD_USER   = root
#     PROD_SSH_KEY = <deploysvr 部署私钥（对应 ~/.ssh/kolmatrix_new 公钥）>
#   部署目录 /opt/apps/kolmatrix 须已 git clone + .env(600) 就位（见 runbook P0）。

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要部署的镜像 tag（git SHA；或 'latest'）。回滚 = 填上一个 good SHA。"
        default: "latest"
        required: true
        type: string
      skip_backup:
        description: "跳过部署前 DB 备份（不推荐）"
        default: false
        type: boolean

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to kol.guangai.ai
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://kol.guangai.ai
    steps:
      - uses: actions/checkout@v4

      # 迁移 ROLLBACK SQL 静态校验（沿用旧流程；针对当前 main 的迁移）
      - name: Validate migration ROLLBACK SQL
        run: ./scripts/validate-rollback-sql.sh

      - name: SSH + docker compose deploy on deploysvr
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE_TAG,SKIP_BACKUP
          script: |
            set -euo pipefail
            cd /opt/apps/kolmatrix
            export IMAGE_TAG
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "── 1/4 pre-deploy DB 备份 (SKIP_BACKUP=${SKIP_BACKUP})"
            if [ "${SKIP_BACKUP}" != "true" ]; then
              mkdir -p backups
              if $COMPOSE ps postgres --status running -q | grep -q .; then
                $COMPOSE exec -T postgres pg_dump -U kolmatrix -Fc kolmatrix \
                  > "backups/db-predeploy-$(date +%Y%m%d-%H%M%S).dump"
                echo "   ✓ 备份完成"
              else
                echo "   ⚠️  postgres 容器未运行（首次部署?），跳过备份"
              fi
            fi

            echo "── 2/4 docker compose pull (IMAGE_TAG=${IMAGE_TAG})"
            $COMPOSE pull

            echo "── 3/4 up -d（migrate 先跑一次，app 依赖其成功后起）"
            $COMPOSE up -d

            echo "── 4/4 healthcheck（/api/health，10×3s 重试）"
            for i in $(seq 1 10); do
              if curl -sf http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
                echo "✅ Deploy healthy: IMAGE_TAG=${IMAGE_TAG}"
                exit 0
              fi
              echo "   healthcheck 重试 $i/10 ..."; sleep 3
            done
            echo "❌ 健康检查失败 — 打印 app 日志后退出（回滚：重跑本 workflow 填上一个 good SHA）"
            $COMPOSE logs --tail=80 app || true
            exit 1
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deploy (IMAGE_TAG=${{ inputs.image_tag }}) failed."
          echo "回滚：重跑本 workflow，image_tag 填上一个已知良好 SHA（compose up -d 会换回旧镜像）。"
          echo "或流量回滚：Cloudflare A 记录改回 34.180.93.185 + PROD_HOST 改回旧值 + 旧机 pm2 start kolmatrix。"
          echo "详见 docs/ops/deploysvr-kol-migration-runbook.md §回滚。"
