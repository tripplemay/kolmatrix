name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".auto-memory/**"
      - "progress.json"
      - "features.json"
      - "backlog.json"
      - "docs/**"
      - "design-draft/**"
      - "framework/**"
      - "**/*.md"
      - "harness-rules.md"
      - ".claude/**"
      - "harness.json"
      - "harness.lock"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".auto-memory/**"
      - "progress.json"
      - "features.json"
      - "backlog.json"
      - "docs/**"
      - "design-draft/**"
      - "framework/**"
      - "**/*.md"
      - "harness-rules.md"
  # BL-070 fix-round 1 — added so we can manually trigger CI on bot
  # commits (e.g., update-visual-baselines.yml auto-commits with the
  # default GITHUB_TOKEN, which by design does NOT cascade to other
  # workflows). Without workflow_dispatch the only path to re-run CI
  # against a bot-committed head was an unrelated code push, which is
  # noisy. Manual trigger from gh CLI / Actions UI is much cleaner.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # CI-only DB URLs (overridden in jobs that use service containers below).
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/kolmatrix?schema=public"
  DATABASE_ADMIN_URL: "postgresql://postgres:postgres@localhost:5432/kolmatrix?schema=public"
  NEXTAUTH_SECRET: "ci-placeholder-secret-do-not-use-in-prod"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  validate-rollback-sql:
    name: Validate migration ROLLBACK SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/validate-rollback-sql.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  build:
    name: Build + migrate smoke
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kolmatrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prisma migrate smoke
        run: npx prisma migrate deploy
      - run: npm run build

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run Vitest unit + coverage
        run: npm run test:coverage
      # Codecov upload is best-effort; a missing CODECOV_TOKEN (private repo,
      # secret not yet configured) must not fail the job.
      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: install
    # NOTE: we rely on Testcontainers (via `npm run test:integration`) to
    # boot its own postgres:16-alpine per test file on random ports, so
    # GitHub service containers would only duplicate work. Docker is
    # pre-installed on ubuntu-latest runners, which is all Testcontainers
    # needs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run integration suite
        run: npm run test:integration

  # BL-094-F001: external-network-dependent integration cases (*.network.test.ts)
  # run in their own job so a Google Fonts blip / latency jitter can't flake the
  # deterministic suites above. The config runs them serially with retry 2;
  # continue-on-error keeps an external-endpoint outage from gating the build
  # (these are guard tests for an upstream we don't control).
  integration-tests-network:
    name: Integration tests (network)
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run network integration suite (serial, retry 2)
        run: npm run test:integration:network

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kolmatrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations + seed dev data
        run: |
          npx prisma migrate deploy
          npm run db:seed
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E (visual project first via dep sequencing)
        # BL-049-F003: playwright.config.ts now defines two projects —
        # `visual` (visual-regression.spec.ts only) and `chromium`
        # (everything else, depends on `visual`). Project dependencies
        # force `visual` to complete before `chromium` starts, which
        # eliminates the legacy race between visual screenshots and
        # mutating specs (bm1-flow / journey-a / journey-b / outreach).
        # Visual is read-only, so the DB stays pristine through that
        # project and chromium can start on the same fresh seed
        # without the previous in-job `npm run db:seed` reseed step.
        run: npx playwright test
      - name: Upload playwright-report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
