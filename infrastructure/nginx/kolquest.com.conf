# kolquest.com — 品牌域 301 redirect to https://kol.guangai.ai (ADR-010)
# DNS 已配（2026-04-19 Cloudflare API 完成 6 条记录）。本 vhost 纯做跳转。
# send.kolquest.com 子域由 Resend MX/SPF/DKIM 处理，无 vhost（BI2 B4 email 发件）。

server {
    listen 80;
    server_name kolquest.com www.kolquest.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kolquest.com www.kolquest.com;

    ssl_certificate     /etc/letsencrypt/live/kolquest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolquest.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS — 与主域一致（浏览器一旦访问过即记住，之后所有 kolquest.com
    # 请求都直连 HTTPS，不用走 HTTP→HTTPS 那一跳）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 301 (permanent) → 主站；保留路径和查询参数
    return 301 https://kol.guangai.ai$request_uri;
}
