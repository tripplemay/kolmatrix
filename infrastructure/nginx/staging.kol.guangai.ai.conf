# staging.kol.guangai.ai — KOLMatrix Staging (PM2 fork on :3002, independent DB kolmatrix_staging)
# BI3 F002: 80→301 + 443 ssl http2 + HSTS + X-Robots-Tag noindex + TLSv1.2/1.3 (via LE include)
# Staging backend comes up via F003 (pm2 app name kolmatrix-staging). Until then, /api/* returns 502 — expected.

upstream kolmatrix_staging_backend {
    server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 80;
    server_name staging.kol.guangai.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name staging.kol.guangai.ai;

    ssl_certificate     /etc/letsencrypt/live/staging.kol.guangai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.kol.guangai.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS — 与主域一致
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 阻止搜索引擎索引 staging（env 说明性防护，实际数据与 prod 隔离）
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 10m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_vary on;

    location / {
        proxy_pass http://kolmatrix_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    location = /api/health {
        proxy_pass http://kolmatrix_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 5s;
    }
}
