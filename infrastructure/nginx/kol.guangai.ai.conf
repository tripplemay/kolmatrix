# kol.guangai.ai — KOLMatrix Next.js app (PM2 cluster on :3001)
# BI2 bootstrap: HTTP-only → certbot → 443 block
# BI3 F001: add HSTS + restate TLS posture (TLSv1.2+1.3 via LE include, ssl_protocols enforced)

upstream kolmatrix_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name kol.guangai.ai;

    # ACME challenge for certbot (webroot mode)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- kol.guangai.ai — KOLMatrix HTTPS ---
server {
    listen 443 ssl http2;
    server_name kol.guangai.ai;

    ssl_certificate     /etc/letsencrypt/live/kol.guangai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kol.guangai.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # BI3 F001: HSTS — 1 year + includeSubDomains (preload 暂不开，irreversible)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_vary on;

    location / {
        proxy_pass http://kolmatrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    # Health check: no cache, no retry buffering
    location = /api/health {
        proxy_pass http://kolmatrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 5s;
    }
}
