name: kolmatrix

# deploysvr 生产编排（容器化 GHCR-pull 模型；BL-PROD-MIGRATE-DEPLOYSVR F-MIG-01）。
# 宿主 nginx 接管公网 80/443 + TLS（见 deploy/nginx/kolmatrix.conf）；本编排不抢端口、不跑 nginx/certbot。
# app 仅映射 127.0.0.1:3001 loopback，由宿主 nginx 反代。pg/redis 不发布 host 端口
# （避开 aigc-gateway 已占的 127.0.0.1:5432 / 6379；迁移期 pg_restore 走 `docker compose exec`）。
# 镜像由 CI 按 git sha 打 tag 推 GHCR；deploysvr 只 pull 不构建（H5 红线：机上 build 撑爆 7.8GB 整机）。
# 回滚 = 换 IMAGE_TAG（app + migrate 同 tag）。
# 需服务器上的 .env（不入仓，600）：GH_REPO / IMAGE_TAG / POSTGRES_PASSWORD / KOLMATRIX_APP_PASSWORD /
#   DATABASE_URL / DATABASE_ADMIN_URL / 全部 app secrets。参考 .env.production.example。

services:
  postgres:
    # H3: pgvector 镜像（KOLMatrix 语义搜索 / embeddings）。pg17 匹配旧机 PG 17.x —
    # 实操前 SSH 旧机 `SELECT version()` 确认 major，restore 跨大版本须一致。
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kolmatrix # superuser（migrate/seed 用）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: kolmatrix
      # 首次 init 脚本 00-init.sh 用它建 kolmatrix_app 角色（H4/BL-043）
      KOLMATRIX_APP_PASSWORD: ${KOLMATRIX_APP_PASSWORD:?KOLMATRIX_APP_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolmatrix -d kolmatrix"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 一次性迁移（先迁移后起 app）：prisma migrate deploy + ALTER ROLE kolmatrix_app 密码同步。
  # 幂等：DB 已是最新（含还原的生产快照）时 migrate 为 no-op。
  migrate:
    image: ghcr.io/${GH_REPO}/migrate:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: "no"
    command: ["sh", "deploy/scripts/migrate-and-sync-role.sh"]
    env_file: .env
    # kol-shared：cron 的 `docker compose run --rm migrate npm run kol-sync:daily` 需经此网络
    # 按容器名访问 apify-kol（F-MIG-03）。migrate 一次性服务连 postgres 走 default。
    networks:
      - default
      - kol-shared
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ghcr.io/${GH_REPO}/app:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file: .env
    environment:
      # Next standalone 默认绑 $HOSTNAME（Docker 注入为容器 ID）→ 容器内 127.0.0.1 不监听、
      # healthcheck ECONNREFUSED。强制绑 0.0.0.0（发布端口仍仅 127.0.0.1 loopback，安全）。
      # aigc 迁移实测踩过（commit 6ef692a）。
      - HOSTNAME=0.0.0.0
    ports:
      - "127.0.0.1:3001:3000" # 仅 loopback；宿主 nginx 反代 → kol.guangai.ai
    # kol-shared：app 内网访问 apify-kol（admin preview 路径, F-MIG-03）。业务 DB/redis 走 default。
    networks:
      - default
      - kol-shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # node:22 内置 fetch；/api/health 无需鉴权（middleware 排除 /api/**）。避免依赖镜像内 curl。
      # 返回 200 healthy / 503 unhealthy（db + redis 检查）。
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

# apify-kol-service 内网互访（F-MIG-03 落地 2026-07-13）：
# 容器内 localhost:3004 ≠ 宿主。apify-kol 随迁 deploysvr 后与本 app/migrate 共享 external 网络
# `kol-shared`，KOLMatrix 用容器名/别名互访：APIFY_KOL_BASE_URL=http://apify-kol:3003。
# 前置（一次性）：`docker network create kol-shared`；apify compose 的 service 也 join 此网络 + alias apify-kol。
networks:
  default: {}
  kol-shared:
    external: true

volumes:
  pgdata:
  redisdata:
