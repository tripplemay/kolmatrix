<h2 id="%E5%B7%A5%E7%A8%8B%E5%B1%82-7-%E6%9D%A1%E7%BB%8F%E9%AA%8C%E7%BB%99%E5%B7%A5%E7%A8%8B%E5%B8%88">工程层 7 条经验（给工程师）</h2>
<table>
<thead>
<tr>
<th>经验</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>设计系统先行</strong></td>
<td>第一个批次必须是设计系统，不是业务页面。后期返工成本是前期 5x</td>
</tr>
<tr>
<td><strong>Pre-Impl Audit</strong></td>
<td>Generator 开工前主动审计 spec vs 实物 → Planner 裁决</td>
</tr>
<tr>
<td><strong>CI 红不开新功能</strong></td>
<td>每次 push 后必查 <code>gh run</code>，红色立即停手</td>
</tr>
<tr>
<td><strong>Critical 修必带回归</strong></td>
<td>修复同 commit 补 regression test，否则 bug 一定回归</td>
</tr>
<tr>
<td><strong>单功能单 migration</strong></td>
<td>不打包 schema 变更，回滚粒度对应风险粒度</td>
</tr>
<tr>
<td><strong>视觉规范 ±2px / ΔE&lt;2</strong></td>
<td>pixel-perfect 量化标准；模糊标准 = AI 输出不收敛</td>
</tr>
<tr>
<td><strong>ADR 沉淀关键决策</strong></td>
<td>AI 长期协作需要决策&quot;长期记忆&quot;，本项目 14 份</td>
</tr>
</tbody>
</table>
